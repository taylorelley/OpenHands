
services:
  openhands:
    build:
      context: ./
      dockerfile: ./containers/app/Dockerfile
    image: openhands:latest
    container_name: openhands-app-${DATE:-}
    environment:
      - AGENT_SERVER_IMAGE_REPOSITORY=${AGENT_SERVER_IMAGE_REPOSITORY:-ghcr.io/openhands/agent-server}
      - AGENT_SERVER_IMAGE_TAG=${AGENT_SERVER_IMAGE_TAG:-1.29.0-python}
      #- SANDBOX_USER_ID=${SANDBOX_USER_ID:-1234} # enable this only if you want a specific non-root sandbox user but you will have to manually adjust permissions of ~/.openhands for this user
      - WORKSPACE_MOUNT_PATH=${WORKSPACE_BASE:-$PWD/workspace}
      # Offline / SSL-inspection support. The pass-through form (no "=") only
      # forwards a variable when it is set on the host, so the image's baked CA
      # defaults (REQUESTS_CA_BUNDLE -> /etc/ssl/certs/ca-certificates.crt) are
      # preserved otherwise. These are also forwarded into the agent-server
      # sandbox (see sandbox_spec_service.AUTO_FORWARD_VARS).
      - OPENHANDS_CA_BUNDLE
      - OPENHANDS_DISABLE_SSL_VERIFY
      - REQUESTS_CA_BUNDLE
      - SSL_CERT_FILE
      - LITE_LLM_API_URL
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.openhands:/.openhands
      - ${WORKSPACE_BASE:-$PWD/workspace}:/opt/workspace_base
    pull_policy: build
    stdin_open: true
    tty: true
